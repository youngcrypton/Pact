<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pactt - Universal Motion Graphics Launch Video (motion.md Engine)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #030712;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    header.studio-bar {
      width: 100%;
      max-width: 1360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 14px 24px;
      background: #0b1329;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .studio-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .studio-pill {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Video Viewport: 16:9 Landscape */
    .video-viewport-wrapper {
      width: 100%;
      max-width: 1360px;
      aspect-ratio: 16 / 9;
      position: relative;
      background: #020617;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.1);
    }
    #stage {
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
      background: #020617;
      overflow: hidden;
      user-select: none;
    }

    /* Tri-Layer Ambient Grid & Light Sweeps */
    .ambient-grid {
      position: absolute;
      top: -200px;
      left: -200px;
      width: 2320px;
      height: 1480px;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.2px, transparent 1.2px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 1;
    }
    .ambient-glow-1 {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.16) 0%, transparent 70%);
      pointer-events: none;
      z-index: 2;
    }
    .ambient-glow-2 {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, transparent 70%);
      pointer-events: none;
      z-index: 2;
    }

    /* Player Controls */
    .controls-panel {
      width: 100%;
      max-width: 1360px;
      margin-top: 18px;
      background: #0b1329;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .scrubber {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: #1e293b;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #10b981;
      border: 2px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.7);
    }
    .timecode {
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      min-width: 140px;
      text-align: right;
    }
    .buttons-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .play-btn {
      background: #10b981;
      color: #020617;
      font-weight: 800;
      font-size: 14px;
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .play-btn:hover { background: #34d399; }
    .voice-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .voice-toggle.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
    }
    .scene-jumpers {
      display: flex;
      gap: 8px;
    }
    .scene-btn {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .scene-btn:hover { background: #334155; color: #ffffff; }
    .scene-btn.active { background: #020617; border-color: #10b981; color: #10b981; }

    /* Animated Subtitles */
    #subtitles {
      position: absolute;
      bottom: 44px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9000;
      pointer-events: none;
    }
    .sub-pill {
      max-width: 1240px;
      padding: 18px 36px;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.7);
      color: #f8fafc;
      font-size: 27px;
      font-weight: 500;
      text-align: center;
      line-height: 1.35;
      letter-spacing: -0.01em;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .sub-pill .hl {
      color: #10b981;
      font-weight: 800;
      text-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
    }

    /* Glassmorphism Card Style */
    .glass-card {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border-radius: 24px;
    }
  </style>
</head>
<body>

  <!-- Studio Header -->
  <header class="studio-bar">
    <div class="studio-title">
      <div style="width: 32px; height: 32px; background: #10b981; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #020617;">P</div>
      <span>Pactt Protocol · Universal Motion Graphics Engine (`motion.md`)</span>
      <span class="studio-pill">Perpetual Kinetic Energy · 16:9 · 90.0s</span>
    </div>
    <div style="display: flex; gap: 14px; align-items: center;">
      <a href="/" style="color: #94a3b8; font-size: 13px; text-decoration: none; font-weight: 600;">← Back to App</a>
      <span style="color: #334155;">|</span>
      <span style="color: #10b981; font-weight: 700; font-size: 13px;">NEAR Hackathon 2026 · Track 12</span>
    </div>
  </header>

  <!-- Video Viewport: 1920x1080 Landscape -->
  <div class="video-viewport-wrapper" id="viewport">
    <div id="stage">
      <!-- Layer 3 (Micro Motion): Ambient Particle Grid & Volumetric Sweeps -->
      <div class="ambient-grid" id="ambientGrid"></div>
      <div class="ambient-glow-1" id="ambientGlow1"></div>
      <div class="ambient-glow-2" id="ambientGlow2"></div>

      <!-- Layer 1 & 2 (Macro & Meso Motion): Dynamic Motion Graphics Content -->
      <div id="motion-content" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;"></div>

      <!-- Kinetic Subtitles -->
      <div id="subtitles">
        <div class="sub-pill" id="subPill"></div>
      </div>
    </div>
  </div>

  <!-- Player Controls Panel -->
  <div class="controls-panel">
    <div class="scrubber-row">
      <input type="range" class="scrubber" id="scrubber" min="0" max="2700" value="0" step="1">
      <div class="timecode" id="timecode">00:00.0 / 01:30.0</div>
    </div>
    <div class="buttons-row">
      <div style="display: flex; align-items: center; gap: 14px;">
        <button class="play-btn" id="playBtn">
          <span id="playIcon">▶</span>
          <span id="playText">Play Launch Video</span>
        </button>

        <button class="voice-toggle active" id="voiceToggle">
          <span id="voiceIcon">🔊</span>
          <span>Siri Voiceover (Calm Female)</span>
        </button>

        <span id="sceneLabel" style="font-size: 13px; font-weight: 700; color: #94a3b8; margin-left: 8px;">Act 1: The Genesis & The Problem</span>
      </div>

      <div class="scene-jumpers">
        <button class="scene-btn active" data-frame="0">Act 1: Genesis (0:00)</button>
        <button class="scene-btn" data-frame="540">Act 2: Proof (0:18)</button>
        <button class="scene-btn" data-frame="1200">Act 3: Engine (0:40)</button>
        <button class="scene-btn" data-frame="1860">Act 4: Scale (1:02)</button>
        <button class="scene-btn" data-frame="2340">Act 5: Climax (1:18)</button>
      </div>
    </div>
  </div>

  <!-- Hidden Voiceover Audio Elements for 5 Acts + Master Track -->
  <audio id="audioAct1" src="/audio/act1.mp3" preload="auto"></audio>
  <audio id="audioAct2" src="/audio/act2.mp3" preload="auto"></audio>
  <audio id="audioAct3" src="/audio/act3.mp3" preload="auto"></audio>
  <audio id="audioAct4" src="/audio/act4.mp3" preload="auto"></audio>
  <audio id="audioAct5" src="/audio/act5.mp3" preload="auto"></audio>
  <audio id="audioMaster" src="/audio/master-voiceover.mp3" preload="auto"></audio>

  <script>
    // Viewport Scaler: Perfectly scales 1920x1080 stage to fit current width
    const viewport = document.getElementById('viewport');
    const stage = document.getElementById('stage');
    function resizeStage() {
      const scale = viewport.clientWidth / 1920;
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeStage);
    resizeStage();

    // Player Elements
    let currentFrame = 0;
    const totalFrames = 2700;
    const fps = 30;
    let isPlaying = false;
    let animId = null;
    let lastTimestamp = 0;
    let voiceEnabled = true;

    const scrubber = document.getElementById('scrubber');
    const timecode = document.getElementById('timecode');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const voiceToggle = document.getElementById('voiceToggle');
    const sceneLabel = document.getElementById('sceneLabel');
    const subPill = document.getElementById('subPill');
    const motionContent = document.getElementById('motion-content');
    const ambientGrid = document.getElementById('ambientGrid');
    const ambientGlow1 = document.getElementById('ambientGlow1');
    const ambientGlow2 = document.getElementById('ambientGlow2');

    const audios = {
      act1: document.getElementById('audioAct1'),
      act2: document.getElementById('audioAct2'),
      act3: document.getElementById('audioAct3'),
      act4: document.getElementById('audioAct4'),
      act5: document.getElementById('audioAct5'),
    };
    const audioMaster = document.getElementById('audioMaster');

    function stopAllAudio() {
      if (audioMaster) {
        audioMaster.pause();
      }
      Object.values(audios).forEach(a => {
        a.pause();
        a.currentTime = 0;
      });
    }

    voiceToggle.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      voiceToggle.classList.toggle('active', voiceEnabled);
      if (!voiceEnabled) stopAllAudio();
    });

    // Subtitle Script synced with Voiceover & Music Cues
    const subtitles = [
      { from: 0, to: 240, text: 'The way decentralized organizations coordinate micro-tasks on <span class="hl">NEAR</span> is broken.' },
      { from: 240, to: 540, text: 'Routine bounties face <span class="hl">multi-day voting fatigue</span> and lost reputation. Introducing <span class="hl">Pactt</span>.' },
      { from: 540, to: 870, text: 'Designed from the ground up for <span class="hl">speed and transparency</span>. When trusted contributors submit work...' },
      { from: 870, to: 1200, text: "Pactt verifies deliverable integrity and releases escrow in <span class=\"hl\">&lt; 4.2 seconds</span> with zero council delays." },
      { from: 1200, to: 1530, text: 'Behind the speed lies mathematical security. <span class="hl">Tiered routing</span> automatically escalates to Sputnik DAO.' },
      { from: 1530, to: 1860, text: 'Rolling <span class="hl">24-hour velocity caps</span> and dispute slashing protect treasury vaults around the clock.' },
      { from: 1860, to: 2100, text: 'Reputation that outlives any single DAO. Every completed bounty mints directly to <span class="hl">NEAR Social</span>.' },
      { from: 2100, to: 2340, text: 'Creating an <span class="hl">immutable on-chain record</span> (<code class="hl">v1.social08.testnet</code>) across the entire ecosystem.' },
      { from: 2340, to: 2700, text: 'Instant micro-bounties. Total treasury security. Build on NEAR with <span class="hl">Pactt</span> today.' }
    ];

    function updateTimecode(f) {
      const sec = f / fps;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 10);
      timecode.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${ms} / 01:30.0`;
    }

    // Spring interpolation helper
    function spring(frame, fromFrame, duration, fromVal, toVal) {
      if (frame < fromFrame) return fromVal;
      const progress = Math.min(1, (frame - fromFrame) / duration);
      // Snappy power4.out easing
      const ease = 1 - Math.pow(1 - progress, 4);
      return fromVal + (toVal - fromVal) * ease;
    }

    // Main Frame Render Loop (Strictly adhering to motion.md)
    function renderFrame(frame) {
      currentFrame = frame;
      scrubber.value = frame;
      updateTimecode(frame);

      // Micro Motion Layer (Ambient drift never stops)
      const driftX = Math.sin(frame * 0.03) * 35;
      const driftY = Math.cos(frame * 0.02) * 25;
      ambientGrid.style.transform = `translate(${driftX}px, ${driftY}px)`;

      const glow1X = 300 + Math.sin(frame * 0.02) * 200;
      const glow1Y = 200 + Math.cos(frame * 0.02) * 150;
      ambientGlow1.style.transform = `translate(${glow1X}px, ${glow1Y}px)`;

      const glow2X = 1100 + Math.cos(frame * 0.025) * 180;
      const glow2Y = 400 + Math.sin(frame * 0.025) * 160;
      ambientGlow2.style.transform = `translate(${glow2X}px, ${glow2Y}px)`;

      // Subtitle Sync
      const sub = subtitles.find(s => frame >= s.from && frame < s.to);
      if (sub) {
        subPill.innerHTML = sub.text;
        subPill.style.opacity = '1';
        subPill.style.transform = 'translateY(0)';
      } else {
        subPill.style.opacity = '0';
        subPill.style.transform = 'translateY(10px)';
      }

      // Continuous Master Audio Sync (Seamless Frame-Locked Voiceover)
      if (voiceEnabled && isPlaying && audioMaster) {
        if (audioMaster.paused) {
          audioMaster.currentTime = frame / fps;
          audioMaster.play().catch(() => {});
        } else {
          const expected = frame / fps;
          if (Math.abs(audioMaster.currentTime - expected) > 0.35) {
            audioMaster.currentTime = expected;
          }
        }
      }

      // Scene Rendering
      if (frame < 540) {
        sceneLabel.textContent = 'Act 1: The Genesis & The Problem (0:00 - 0:18)';
        renderAct1(frame);
      } else if (frame < 1200) {
        sceneLabel.textContent = 'Act 2: The Interface & Tangible Proof (0:18 - 0:40)';
        renderAct2(frame - 540);
      } else if (frame < 1860) {
        sceneLabel.textContent = 'Act 3: The Engine & Deep Mechanics (0:40 - 1:02)';
        renderAct3(frame - 1200);
      } else if (frame < 2340) {
        sceneLabel.textContent = 'Act 4: Scale, Ecosystem & Social Proof (1:02 - 1:18)';
        renderAct4(frame - 1860);
      } else {
        sceneLabel.textContent = 'Act 5: The Climax & Unstoppable Call to Action (1:18 - 1:30)';
        renderAct5(frame - 2340);
      }

      // Update active nav jumper
      document.querySelectorAll('.scene-btn').forEach(btn => {
        const start = parseInt(btn.dataset.frame);
        let nextStart = 2700;
        if (start === 0) nextStart = 540;
        else if (start === 540) nextStart = 1200;
        else if (start === 1200) nextStart = 1860;
        else if (start === 1860) nextStart = 2340;
        btn.classList.toggle('active', frame >= start && frame < nextStart);
      });
    }

    // ==========================================
    // ACT 1: THE GENESIS & THE PROBLEM
    // ==========================================
    function renderAct1(f) {
      // Macro Motion: Scale dive handoff towards end of Act 1 (f: 480 to 540)
      const zoomDive = f >= 480 ? spring(f, 480, 60, 1, 4.2) : 1;
      const diveOpacity = f >= 510 ? 1 - ((f - 510) / 30) : 1;

      // Cards staggered entry
      const card1Scale = spring(f, 60, 24, 0, 1);
      const card2Scale = spring(f, 120, 24, 0, 1);
      const card3Scale = spring(f, 180, 24, 0, 1);

      // Hero Title entrance
      const titleY = spring(f, 0, 30, 40, 0);
      const titleOpacity = spring(f, 0, 20, 0, 1);

      // Continuous 3D Gyro Tilt
      const tiltX = Math.sin(f * 0.04) * 4;
      const tiltY = Math.cos(f * 0.03) * 6;

      motionContent.innerHTML = `
        <div style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: scale(${zoomDive}) perspective(1200px) rotateX(${tiltX}deg) rotateY(${tiltY}deg); opacity: ${diveOpacity};">
          
          <!-- Category Tag -->
          <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 999px; padding: 8px 20px; color: #f87171; font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 24px; opacity: ${titleOpacity}; transform: translateY(${titleY}px);">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 10px #ef4444;"></span>
            THE DAO VOTING FRICTION CRISIS
          </div>

          <!-- Hero Headline -->
          <h1 style="font-size: 68px; font-weight: 900; color: #ffffff; letter-spacing: -0.04em; text-align: center; max-width: 1200px; line-height: 1.1; margin-bottom: 20px; opacity: ${titleOpacity}; transform: translateY(${titleY}px);">
            Routine Micro-Tasks on NEAR are Trapped in Bureaucracy.
          </h1>

          <p style="font-size: 22px; color: #94a3b8; text-align: center; max-width: 900px; line-height: 1.5; margin-bottom: 60px; opacity: ${titleOpacity};">
            Every 2 NEAR bounty requires 5-person council consensus, burning proposal bonds and resetting contributor trust to zero upon payout.
          </p>

          <!-- 3 Staggered Pain Point Cards (Meso Motion) -->
          <div style="display: flex; gap: 28px; max-width: 1300px; width: 100%; justify-content: center;">
            
            <div class="glass-card" style="flex: 1; padding: 36px 32px; border-color: rgba(239, 68, 68, 0.3); transform: scale(${card1Scale});">
              <div style="font-size: 40px; margin-bottom: 16px;">⏱️</div>
              <div style="font-size: 28px; font-weight: 800; color: #f87171; margin-bottom: 8px;">3 to 5 Days</div>
              <div style="font-size: 16px; color: #cbd5e1; line-height: 1.4;">Average council voting latency for trivial documentation and bug fix tasks.</div>
            </div>

            <div class="glass-card" style="flex: 1; padding: 36px 32px; border-color: rgba(245, 158, 11, 0.3); transform: scale(${card2Scale});">
              <div style="font-size: 40px; margin-bottom: 16px;">📉</div>
              <div style="font-size: 28px; font-weight: 800; color: #fbbf24; margin-bottom: 8px;">0.1 NEAR Bonds</div>
              <div style="font-size: 16px; color: #cbd5e1; line-height: 1.4;">Capital burned per proposal, locking out global open-source newcomers.</div>
            </div>

            <div class="glass-card" style="flex: 1; padding: 36px 32px; border-color: rgba(99, 102, 241, 0.3); transform: scale(${card3Scale});">
              <div style="font-size: 40px; margin-bottom: 16px;">🧹</div>
              <div style="font-size: 28px; font-weight: 800; color: #818cf8; margin-bottom: 8px;">Lost Reputation</div>
              <div style="font-size: 16px; color: #cbd5e1; line-height: 1.4;">Sputnik DAO deletes task claims upon payout; trust is never compounded.</div>
            </div>

          </div>

          <!-- Central Brand Hero Logo (Dive Target for Handoff) -->
          <div style="margin-top: 50px; display: flex; align-items: center; gap: 14px;">
            <div style="width: 52px; height: 52px; background: #10b981; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 28px; color: #020617; box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);">P</div>
            <span style="font-size: 32px; font-weight: 900; color: #ffffff; letter-spacing: -0.03em;">Pactt Protocol</span>
          </div>

        </div>
      `;
    }

    // ==========================================
    // ACT 2: THE INTERFACE & TANGIBLE PROOF
    // ==========================================
    function renderAct2(f) {
      // Entry momentum inheriting from Act 1 dive
      const entryScale = spring(f, 0, 30, 0.65, 1);
      const isSettled = f >= 420;
      const isVerifying = f >= 280 && f < 420;

      // Trust score rolling counter
      const scoreTicking = Math.min(1, Math.max(0, (f - 420) / 60));
      const currentScore = 142.5 + scoreTicking * 33.0;

      // 3D Parallax Pitch
      const rotY = Math.sin(f * 0.03) * 5;
      const rotX = Math.cos(f * 0.03) * 3;

      // Exit Handoff: Card unfolds into pipeline at end of Act 2 (f: 600 to 660)
      const exitFold = f >= 600 ? spring(f, 600, 60, 1, 0.8) : 1;
      const exitOpacity = f >= 630 ? 1 - ((f - 630) / 30) : 1;

      motionContent.innerHTML = `

    // Playback Loop (30 FPS)
    function tick(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = timestamp - lastTimestamp;
      if (delta >= (1000 / fps)) {
        currentFrame = (currentFrame + 1) % (totalFrames + 1);
        renderFrame(currentFrame);
        lastTimestamp = timestamp;
      }
      animId = requestAnimationFrame(tick);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playIcon.textContent = '⏸';
        playText.textContent = 'Pause';
        lastTimestamp = performance.now();
        if (voiceEnabled && audioMaster) {
          audioMaster.currentTime = currentFrame / fps;
          audioMaster.play().catch(() => {});
        }
        animId = requestAnimationFrame(tick);
      } else {
        playIcon.textContent = '▶';
        playText.textContent = 'Play Launch Video';
        if (animId) cancelAnimationFrame(animId);
        stopAllAudio();
      }
    }

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      }
    });

      const f = parseInt(e.target.value);
      if (isPlaying) togglePlay();
      if (audioMaster) {
