<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pactt - Hackathon Demo Video (16:9 Light Mode Studio)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      overflow-x: hidden;
    }
    header.studio-bar {
      width: 100%;
      max-width: 1360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 14px 24px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .studio-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .studio-pill {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .video-viewport-wrapper {
      width: 100%;
      max-width: 1360px;
      aspect-ratio: 16 / 9;
      position: relative;
      background: #f8fafc;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.1);
    }
    #stage {
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
      background: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Player Controls */
    .controls-panel {
      width: 100%;
      max-width: 1360px;
      margin-top: 18px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .scrubber {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: #334155;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #10b981;
      border: 2px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }
    .timecode {
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      min-width: 140px;
      text-align: right;
    }
    .buttons-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .play-btn {
      background: #10b981;
      color: #020617;
      font-weight: 800;
      font-size: 14px;
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .play-btn:hover { background: #34d399; }
    .scene-jumpers {
      display: flex;
      gap: 8px;
    }
    .scene-btn {
      background: #334155;
      border: 1px solid rgba(255,255,255,0.08);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .scene-btn:hover { background: #475569; color: #ffffff; }
    .scene-btn.active { background: #020617; border-color: #10b981; color: #10b981; }

    /* Cursor Pointer */
    #cursor {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-2px, -2px);
      transition: transform 0.08s ease;
    }
    .ripple {
      position: absolute;
      left: 2px;
      top: 2px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #10b981;
      transform: translate(-50%, -50%);
      background: rgba(16, 185, 129, 0.25);
    }

    /* Subtitles Container */
    #subtitles {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9000;
      pointer-events: none;
    }
    .sub-pill {
      max-width: 1280px;
      padding: 16px 32px;
      background: rgba(2, 6, 23, 0.90);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
      color: #f8fafc;
      font-size: 26px;
      font-weight: 500;
      text-align: center;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }
    .sub-pill .hl {
      color: #10b981;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
    }
  </style>
</head>
<body>

  <!-- Studio Header -->
  <header class="studio-bar">
    <div class="studio-title">
      <div style="width: 32px; height: 32px; background: #020617; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff;">P</div>
      <span>Pactt Protocol · 16:9 Light Mode Studio Video</span>
      <span class="studio-pill">90.0s · 2,700 Frames · 30 FPS</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="/" style="color: #94a3b8; font-size: 13px; text-decoration: none; font-weight: 600;">← Back to App</a>
      <span style="color: #64748b;">|</span>
      <span style="color: #10b981; font-weight: 700; font-size: 13px;">Target: NEAR Hackathon 2026</span>
    </div>
  </header>

  <!-- Video Viewport (16:9 Landscape) -->
  <div class="video-viewport-wrapper" id="viewport">
    <div id="stage">
      <!-- Injected Frame Markup -->
      <div id="stage-content" style="width: 100%; height: 100%; position: relative;"></div>

      <!-- Mouse Cursor -->
      <div id="cursor">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));">
          <path d="M5.5 3.2L18.5 12.2L12.5 13.5L16 20.8L13.2 22.2L9.8 15L5.5 19.2V3.2Z" fill="#020617" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <div id="cursor-ripple" class="ripple" style="display: none;"></div>
      </div>

      <!-- Kinetic Subtitles -->
      <div id="subtitles">
        <div class="sub-pill" id="sub-pill"></div>
      </div>
    </div>
  </div>

  <!-- Player Controls -->
  <div class="controls-panel">
    <div class="scrubber-row">
      <input type="range" class="scrubber" id="scrubber" min="0" max="2700" value="0" step="1">
      <div class="timecode" id="timecode">00:00.0 / 01:30.0</div>
    </div>
    <div class="buttons-row">
      <div style="display: flex; align-items: center; gap: 16px;">
        <button class="play-btn" id="playBtn">
          <span id="playIcon">▶</span>
          <span id="playText">Play (30 FPS)</span>
        </button>
        <span id="sceneLabel" style="font-size: 13px; font-weight: 700; color: #94a3b8;">Scene 1: The Problem</span>
      </div>

      <div class="scene-jumpers">
        <button class="scene-btn active" data-frame="0">1. Problem (0:00)</button>
        <button class="scene-btn" data-frame="450">2. Magic Moment (0:15)</button>
        <button class="scene-btn" data-frame="1200">3. Sputnik Safety (0:40)</button>
        <button class="scene-btn" data-frame="1800">4. SocialDB Proofs (1:00)</button>
        <button class="scene-btn" data-frame="2340">5. Outro (1:18)</button>
      </div>
    </div>
  </div>

  <script>
    // Scale 1920x1080 stage to fit viewport
    const viewport = document.getElementById('viewport');
    const stage = document.getElementById('stage');
    function resizeStage() {
      const scale = viewport.clientWidth / 1920;
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeStage);
    resizeStage();

    // Player State
    let currentFrame = 0;
    const totalFrames = 2700;
    const fps = 30;
    let isPlaying = false;
    let animId = null;
    let lastTimestamp = 0;

    const scrubber = document.getElementById('scrubber');
    const timecode = document.getElementById('timecode');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const sceneLabel = document.getElementById('sceneLabel');
    const cursor = document.getElementById('cursor');
    const cursorRipple = document.getElementById('cursor-ripple');
    const subPill = document.getElementById('sub-pill');
    const stageContent = document.getElementById('stage-content');

    // Subtitle Script
    const subtitles = [
      { from: 0, to: 210, text: 'Decentralized autonomous organizations on <span class="hl">NEAR</span> face a massive friction: <span class="hl">voting fatigue</span>.' },
      { from: 210, to: 450, text: 'Routine micro-tasks require <span class="hl">full council voting</span> and <span class="hl">proposal bonds</span>, treating experienced contributors like strangers.' },
      { from: 450, to: 720, text: '<span class="hl">Pactt</span> introduces <span class="hl">3-Tier Dynamic Approvals</span>. When <span class="hl">Alex</span> submits a <span class="hl">4.5 NEAR</span> task...' },
      { from: 720, to: 960, text: 'Pactt verifies deliverable integrity and settles payout <span class="hl">autonomously in < 4.2s</span> with <span class="hl">0 council votes</span>.' },
      { from: 960, to: 1200, text: 'Alex\'s trust score increments to <span class="hl">175.5 points</span> with zero council votes and zero delays.' },
      { from: 1200, to: 1500, text: '<span class="hl">Custody never leaves the DAO</span>. When a newcomer submits a task or rewards exceed <span class="hl">25 NEAR</span>...' },
      { from: 1500, to: 1800, text: 'Pactt automatically bridges to <span class="hl">Sputnik DAO v2</span> council consensus, keeping treasury funds completely protected.' },
      { from: 1800, to: 2070, text: 'Pactt protects treasuries with rolling <span class="hl">24-hour velocity caps</span> and council <span class="hl">dispute slashing</span>.' },
      { from: 2070, to: 2340, text: 'Completed work is permanently minted to <span class="hl">NEAR Social</span> (<code class="hl">v1.social08.testnet</code>) as a portable Web3 credential.' },
      { from: 2340, to: 2700, text: 'Visit <span class="hl">pactt.terminall.workers.dev</span> and explore our open code on <span class="hl">GitHub</span>. Thank you!' }
    ];

    function updateTimecode(f) {
      const sec = f / fps;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 10);
      timecode.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${ms} / 01:30.0`;
    }

    function renderFrame(frame) {
      currentFrame = frame;
      scrubber.value = frame;
      updateTimecode(frame);

      // Active Subtitle
      const sub = subtitles.find(s => frame >= s.from && frame < s.to);
      if (sub) {
        subPill.innerHTML = sub.text;
        subPill.style.display = 'block';
      } else {
        subPill.style.display = 'none';
      }

      // Active Scene & Content Rendering
      if (frame < 450) {
        sceneLabel.textContent = 'Scene 1: The User Problem (0:00 - 0:15)';
        renderScene1(frame);
      } else if (frame < 1200) {
        sceneLabel.textContent = 'Scene 2: The Magic Moment - 4.2s Instant Settlement (0:15 - 0:40)';
        renderScene2(frame - 450);
      } else if (frame < 1800) {
        sceneLabel.textContent = 'Scene 3: Sputnik DAO Custody & Treasury Safety (0:40 - 1:00)';
        renderScene3(frame - 1200);
      } else if (frame < 2340) {
        sceneLabel.textContent = "Scene 4: NEAR's Role Concretely & SocialDB Proofs (1:00 - 1:18)";
        renderScene4(frame - 1800);
      } else {
        sceneLabel.textContent = 'Scene 5: Outro & Protocol Verification Links (1:18 - 1:30)';
        renderScene5(frame - 2340);
      }

      // Update active jumper button
      document.querySelectorAll('.scene-btn').forEach(btn => {
        const start = parseInt(btn.dataset.frame);
        let nextStart = 2700;
        if (start === 0) nextStart = 450;
        else if (start === 450) nextStart = 1200;
        else if (start === 1200) nextStart = 1800;
        else if (start === 1800) nextStart = 2340;
        btn.classList.toggle('active', frame >= start && frame < nextStart);
      });
    }

    // Scene 1: The Problem
    function renderScene1(f) {
      const showAlert = f >= 90;
      const curX = 960 - (f / 450) * 400;
      const curY = 320 + (f / 450) * 350;
      cursor.style.transform = `translate(${curX}px, ${curY}px)`;
      cursorRipple.style.display = 'none';

      stageContent.innerHTML = `
        <div style="display: flex; flex-direction: column; width: 100%; height: 100%;">
          ${renderHeader('alex.testnet', 142.5, 'bounties')}
          <div style="padding: 36px 64px; display: flex; flex-direction: column; gap: 24px; flex: 1;">
            ${renderHero(
              'Instant DAO Bounties. Zero Voter Fatigue.',
              'Standard Sputnik DAOs force every 2 NEAR micro-task through 5-person council votes and multi-day delays. Even worse, claim history is wiped upon completion, treating experienced contributors like strangers.',
              'THE DAO FRICTION PROBLEM',
              showAlert
            )}
            ${renderMetrics(103.5, 49.5, '< 4.2s', 48)}
            ${renderBountiesTable('#B-103', false)}
          </div>
        </div>
        ${showAlert ? `
          <div style="position: absolute; top: 380px; right: 80px; width: 480px; background: #ffffff; border-radius: 18px; border: 2px solid #ef4444; box-shadow: 0 20px 50px -10px rgba(239, 68, 68, 0.35); padding: 26px; z-index: 4000;">
            <div style="display: flex; align-items: center; gap: 8px; color: #dc2626; font-weight: 800; font-size: 13px; text-transform: uppercase;">
              <span>⚠️</span> <span>Voter Fatigue Trap</span>
            </div>
            <div style="font-size: 20px; font-weight: 800; color: #020617; margin: 10px 0;">3 Days Waiting for a 2 NEAR Task</div>
            <div style="font-size: 14px; color: #64748b; line-height: 1.5;">Without algorithmic trust tiers, routine micro-tasks require full council consensus, proposal bonds, and manual multi-sig signatures, stalling community momentum.</div>
          </div>
        ` : ''}
      `;
    }

    // Scene 2: Magic Moment
    function renderScene2(f) {
      const isDrawerOpen = f >= 80;
      const isSettled = f >= 396;
      const isVerifying = f >= 270 && f < 396;
      const scoreProgress = Math.min(1, Math.max(0, (f - 396) / 54));
      const currentScore = 142.5 + scoreProgress * 33.0;

      let curX = 960, curY = 540, isClicking = false;
      if (f < 80) {
        curX = 960 + (f / 60) * 820;
        curY = 540 + (f / 60) * 175;
        isClicking = f >= 60 && f <= 75;
      } else if (f < 280) {
        curX = 1780 - ((f - 80) / 180) * 160;
        curY = 715 + ((f - 80) / 180) * 265;
        isClicking = f >= 265 && f <= 280;
      } else {
        curX = 1620; curY = 980;
      }
      cursor.style.transform = `translate(${curX}px, ${curY}px) scale(${isClicking ? 0.88 : 1})`;
      cursorRipple.style.display = isClicking ? 'block' : 'none';

      stageContent.innerHTML = `
        <div style="display: flex; flex-direction: column; width: 100%; height: 100%;">
          ${renderHeader('alex.testnet', currentScore, 'bounties')}
          <div style="padding: 36px 64px; display: flex; flex-direction: column; gap: 24px; flex: 1;">
            ${renderHero(
              'Tier 1 Algorithmic Routing: Settled in 4.2 Seconds.',
              'When trusted core contributor Alex submits verified work for a 4.5 NEAR task, Pactt verifies deliverable integrity and releases escrow automatically with 0 council votes.',
              'MAGIC MOMENT · INSTANT AUTONOMOUS SETTLEMENT',
              false
            )}
            ${renderMetrics(isSettled ? 99.0 : 103.5, isSettled ? 54.0 : 49.5, '3.8s', isSettled ? 49 : 48)}
            ${renderBountiesTable('#B-102', isSettled)}
          </div>
        </div>
        ${isDrawerOpen ? renderDrawer(
          '#B-102', 'Refactor Indexer Query Pipeline for Low-Latency SSE', 4.5,
          'alex.testnet', currentScore,
          isSettled ? 'settled' : isVerifying ? 'verifying' : 'input',
          'https://github.com/youngcrypton/Pactt/pull/88', true
        ) : ''}
      `;
    }

    // Scene 3: Sputnik Safety
    function renderScene3(f) {
      const isDrawerOpen = f >= 60;
      const isDaoForwarded = f >= 180;
      const curX = 400 + (f / 600) * 1100;
      const curY = 300 + (f / 600) * 500;
      cursor.style.transform = `translate(${curX}px, ${curY}px)`;
      cursorRipple.style.display = 'none';

      stageContent.innerHTML = `
        <div style="display: flex; flex-direction: column; width: 100%; height: 100%;">
          ${renderHeader('newuser.testnet', 0.0, 'bounties')}
          <div style="padding: 36px 64px; display: flex; flex-direction: column; gap: 24px; flex: 1;">
            ${renderHero(
              'Treasury Custody Never Leaves Sputnik DAO.',
              "When a newcomer claims a task or rewards exceed 25 NEAR, Pactt's algorithmic routing bridges directly to Sputnik DAO v2 council consensus. 24-hour velocity caps and dispute slashing ensure zero treasury drain.",
              'TIER 3 SAFETY · SPUTNIK DAO MULTI-SIG',
              false
            )}
            ${renderMetrics(99.0, 54.0, 'Multi-Sig', 49)}
            ${renderBountiesTable('#B-108', false, true)}
          </div>
        </div>
        ${isDrawerOpen ? renderDrawer(
          '#B-108', 'Smart Contract Re-entrancy & Invariant Security Audit', 50.0,
          'newuser.testnet', 0.0,
          isDaoForwarded ? 'dao_forwarded' : 'input',
          'https://github.com/youngcrypton/Pactt/security/audit-report.pdf', false
        ) : ''}
      `;
    }

    // Scene 4: SocialDB Proofs
    function renderScene4(f) {
      const curX = 500 + (f / 540) * 900;
      const curY = 400 + (f / 540) * 200;
      cursor.style.transform = `translate(${curX}px, ${curY}px)`;
      cursorRipple.style.display = 'none';

      stageContent.innerHTML = `
        <div style="display: flex; flex-direction: column; width: 100%; height: 100%;">
          ${renderHeader('alex.testnet', 175.5, 'trust')}
          <div style="padding: 36px 64px; display: flex; flex-direction: column; gap: 24px; flex: 1;">
            <div style="background: #020617; border-radius: 24px; padding: 32px 40px; color: #ffffff; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.3);">
              <div>
                <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 999px; padding: 6px 14px; color: #818cf8; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 12px;">
                  <span style="width: 6px; height: 6px; border-radius: 50%; background: #6366f1;"></span>
                  PORTABLE ON-CHAIN REPUTATION · NEAR SOCIAL (v1.social08.testnet)
                </div>
                <h1 style="font-size: 30px; font-weight: 800; margin: 0 0 8px 0; letter-spacing: -0.02em;">Soulbound Proofs Outlive Any Single DAO.</h1>
                <p style="font-size: 15px; color: #e2e8f0; margin: 0; max-width: 850px;">Unlike Sputnik DAO which erases claim history upon disbursement, Pactt writes verifiable reputation directly to NEAR Social. Contributors carry their trust everywhere across Web3.</p>
              </div>
              <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 20px 24px; text-align: right;">
                <div style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">NEAR Explorer Proof</div>
                <div style="font-size: 14px; font-family: monospace; color: #38bdf8; font-weight: 700; margin: 4px 0;">ExWvUsgiL5yb...J8 ↗</div>
                <div style="font-size: 12px; color: #10b981; font-weight: 600;">✓ Confirmed on NEAR Testnet</div>
              </div>
            </div>
            ${renderTrustRegistryTable()}
          </div>
        </div>
      `;
    }

    // Scene 5: Outro
    function renderScene5(f) {
      cursor.style.transform = `translate(960px, 540px)`;
      cursorRipple.style.display = 'none';

      stageContent.innerHTML = `
        <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
          <div style="width: 1240px; background: #ffffff; border-radius: 32px; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 25px 60px -15px rgba(0,0,0,0.1); padding: 64px 72px; display: flex; flex-direction: column; align-items: center; text-align: center;">
            <div style="display: inline-flex; align-items: center; gap: 8px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 999px; padding: 8px 20px; color: #065f46; font-size: 13px; font-weight: 800; text-transform: uppercase; margin-bottom: 24px;">
              <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981;"></span>
              NEAR HACKATHON 2026 · TRACK 12: SOCIAL & SPUTNIK DAO ESCROW
            </div>
            <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 18px;">
              <div style="width: 64px; height: 64px; background: #020617; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 32px;">P</div>
              <span style="font-size: 48px; font-weight: 900; color: #020617; letter-spacing: -0.04em;">Pactt</span>
            </div>
            <h1 style="font-size: 38px; font-weight: 800; color: #020617; line-height: 1.2; letter-spacing: -0.03em; margin: 0 0 16px 0;">Instant DAO Bounties. Zero Voter Fatigue.</h1>

            <tbody>
              ${rows.map(r => `
                <tr style="border-bottom: 1px solid #f8fafc; background: ${r.isAlex ? '#f0fdf4' : 'transparent'};">
                  <td style="padding: 14px; font-weight: 700; color: #64748b;">${r.rank}</td>
                  <td style="padding: 14px; font-family: monospace; font-weight: 700; color: #0f172a;">${r.id}</td>
                  <td style="padding: 14px; font-weight: 800; color: ${r.isAlex ? '#059669' : '#020617'}; font-size: 15px;">${r.score.toFixed(1)}</td>
                  <td style="padding: 14px; color: #475569; font-weight: 600;">${r.completed}</td>
                  <td style="padding: 14px; color: #475569;">${r.role}</td>
                  <td style="padding: 14px; font-weight: 700; color: #020617;">${r.earned}</td>
                  <td style="padding: 14px;"><span style="font-size: 11px; font-weight: 700; background: ${r.tier.includes('Tier 1') ? '#ecfdf5' : '#fef3c7'}; color: ${r.tier.includes('Tier 1') ? '#065f46' : '#92400e'}; padding: 4px 10px; border-radius: 999px;">${r.tier}</span></td>
                  <td style="padding: 14px; text-align: right;"><span style="font-size: 11px; font-weight: 700; background: #fef3c7; color: #b45309; border: 1px solid #fde68a; padding: 6px 12px; border-radius: 8px;">${r.badge}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // Playback Loop (30 FPS)
    function tick(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = timestamp - lastTimestamp;
      if (delta >= (1000 / fps)) {
        currentFrame = (currentFrame + 1) % (totalFrames + 1);
        renderFrame(currentFrame);
        lastTimestamp = timestamp;
      }
      animId = requestAnimationFrame(tick);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playIcon.textContent = '⏸';
        playText.textContent = 'Pause';
        lastTimestamp = performance.now();
        animId = requestAnimationFrame(tick);
      } else {
        playIcon.textContent = '▶';
        playText.textContent = 'Play (30 FPS)';
        if (animId) cancelAnimationFrame(animId);
      }
    }

    playBtn.addEventListener('click', togglePlay);
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      }
    });

    scrubber.addEventListener('input', (e) => {
      const f = parseInt(e.target.value);
      if (isPlaying) togglePlay();
      renderFrame(f);
    });

    document.querySelectorAll('.scene-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const f = parseInt(btn.dataset.frame);
        if (isPlaying) togglePlay();
        renderFrame(f);
      });
    });

    // Initial render at frame 0
    window.renderFrame = renderFrame;
    window.togglePlay = togglePlay;
    renderFrame(0);
  </script>
</body>
</html>
